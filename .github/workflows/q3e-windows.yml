# N10-Q3E: Windows x64 build of Cat Arena on the Quake3e engine (engine/quake3e + game/).
# Engine: same MSVC projects and order as upstream's own CI (ec-/Quake3e build.yml, windows-msvc),
# Release x64, Vulkan renderer. Game modules: CMake + MSVC (C for the Quake III game code, C++20 for
# Cat Arena). Runs on pushes to the migration branches that touch the engine, the game, the base
# data or this workflow (a manual start needs the workflow on the default branch).
name: q3e-windows

on:
  workflow_dispatch:
  push:
    branches: ['migration/**']
    paths: ['engine/**', 'game/**', 'tools/q3e/**', '.github/workflows/q3e-windows.yml']

jobs:
  build:
    name: Cat Arena Q3E Windows x64 (MSVC, Vulkan)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Build engine (dedicated server, then client with the Vulkan renderer)
        working-directory: engine/quake3e
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          msbuild code\win32\msvc2017\quake3e-ded.vcxproj -p:TargetName=quake3e.ded,Configuration=Release,Platform=x64 /p:PlatformToolset=v143 -v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item code\win32\msvc2017\output\quake3e.ded.exe bin\quake3e.ded.x64.exe
          msbuild code\win32\msvc2017\quake3e-ded.vcxproj -p:TargetName=quake3e.ded,Configuration=Release,Platform=x64 -t:Clean -v:minimal
          msbuild code\win32\msvc2017\renderervk.vcxproj -p:Configuration=Release,Platform=x64 /p:PlatformToolset=v143 -v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          msbuild code\win32\msvc2017\quake3e.vcxproj -p:TargetName=quake3e,Configuration=Release,Platform=x64,UseWasapi=USE_WASAPI=0 /p:PlatformToolset=v143 -v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item code\win32\msvc2017\output\quake3e.exe bin\quake3e-vulkan.x64.exe
          Get-ChildItem bin | Format-Table Name, Length

      - name: Build game modules (qagame, cgame, ui; C + C++20)
        run: |
          cmake -S game -B build-game -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build-game --config Release -- /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem build-game\Release\*.dll | Format-Table Name, Length

      - name: Package
        run: |
          python tools/q3e/package.py --engine-dir engine/quake3e/bin --client quake3e-vulkan.x64.exe --server quake3e.ded.x64.exe --modules-dir build-game/Release --out dist/CatArena --commit $env:GITHUB_SHA
          python -c "import zipfile, sys; n = set(zipfile.ZipFile('dist/CatArena/catarena/pak0.pk3').namelist()); s = [x for x in n if x.startswith('sound/catarena/') and x.endswith('.wav')]; ok = len(s) == 86 and {'music/ashen_drive.ogg', 'sound/catarena/sounds.txt', 'sound/feedback/hit.wav'} <= n; print('PASS' if ok else 'FAIL', 'pak0.pk3:', len(s), 'Cat Arena sounds, soundtrack', 'music/ashen_drive.ogg' in n); sys.exit(0 if ok else 1)"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test (dedicated server loads the test arena, gameplay self-test)
        working-directory: dist/CatArena
        run: |
          $p = Start-Process -FilePath .\CatArena-server.exe -ArgumentList "+set dedicated 1 +set logfile 2 +set fs_homepath `"$PWD\home`" +map ca_test +ca_selftest +quit" -NoNewWindow -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "FAIL: server did not quit within 90 s"; exit 1 }
          $log = Get-Content home\catarena\qconsole.log -Raw
          Write-Host $log
          $checks = @('VM_LoadDll\(qagame\) succeeded', 'Cat Arena: Feral Claw N10-Q3E-D7 \(qagame, C\+\+20 bridge\)', 'C\+\+20 bridge self-test: PASS', 'mapname\\ca_test', 'Cat Arena horde ready', 'ca_selftest: horde PASS', 'ca_selftest: PASS N10 weapon table: 16/16', 'ca_selftest: PASS N10 enemy table: 10/10', 'ca_selftest: PASS all 20 enemy types spawn', 'ca_selftest: PASS skyprobe flies', 'ca_selftest: weapons PASS', 'ca_selftest: ALL PASS')
          $fail = $false
          foreach ($c in $checks) { if ($log -match $c) { Write-Host "PASS $c" } else { Write-Host "FAIL $c"; $fail = $true } }
          Write-Host "server exit code $($p.ExitCode)"
          if ($fail -or $p.ExitCode -ne 0) { exit 1 }
          Remove-Item -Recurse -Force home
          # the four maps converted from N10: map load + gameplay, enemy and weapon self-test on each
          foreach ($m in @('ca_reactor', 'ca_helios', 'ca_bastion', 'ca_arsenal')) {
            $p = Start-Process -FilePath .\CatArena-server.exe -ArgumentList "+set dedicated 1 +set logfile 2 +set fs_homepath `"$PWD\home`" +map $m +ca_selftest +quit" -NoNewWindow -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "FAIL: server did not quit within 180 s ($m)"; exit 1 }
            $log = Get-Content home\catarena\qconsole.log -Raw
            foreach ($c in @("mapname\\$m", "N10 navigation graph for $m", 'ca_selftest: PASS N10 routes', 'ca_selftest: PASS all 20 enemy types spawn', 'ca_selftest: PASS skyprobe flies', 'ca_selftest: weapons PASS', 'ca_selftest: ALL PASS')) { if ($log -match $c) { Write-Host "PASS $m $c" } else { Write-Host "FAIL $m $c"; $fail = $true } }
            ($log -split "`n") | Where-Object { $_ -match 'ca_selftest|navigation graph' } | ForEach-Object { Write-Host "${m}: $_" }
            if ($fail -or $p.ExitCode -ne 0) { Write-Host $log; exit 1 }
            Remove-Item -Recurse -Force home
          }
          Write-Host "PASS q3e Windows smoke: engine + Cat Arena DLLs + ca_test.bsp + the four N10 maps + gameplay, enemy and weapon self-tests"

      - uses: actions/upload-artifact@v4
        with:
          name: CAT_ARENA_Q3E_D7_WINDOWS_x64
          path: dist/CatArena
          if-no-files-found: error
          retention-days: 30
