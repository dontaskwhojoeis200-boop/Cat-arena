// Cat Arena: Feral Claw — engine defaults (N10-Q3E, generated by tools/q3e/make_base.py)
// SHIFT sprint (+button5), C / CTRL crouch (slide when sprinting), R reload (+button6),
// Q switch weapon (+button7)
// Native game modules only (the Cat Arena modules are C++20; QVM cannot run them).
seta vm_game "0"
seta vm_cgame "0"
seta vm_ui "0"
seta cl_renderer "vulkan"
seta com_introPlayed "1"
seta sv_pure "0"
seta bot_enable "0"
seta fraglimit "0"
seta timelimit "0"
seta name "Cat"
seta cl_run "1"
seta sensitivity "5"
seta r_mode "-1"
seta r_customwidth "1280"
seta r_customheight "720"
seta r_fullscreen "0"
seta r_vbo "1"
seta cg_drawFPS "1"
unbindall
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"
bind c "+movedown"
bind CTRL "+movedown"
bind SHIFT "+button5"
bind q "+button7"
// creatures are drawn as polygons (posed every frame): room for 20 live ones and 24 bodies
seta r_maxpolys "16384"
seta r_maxpolyverts "65536"
// N10 audio defaults (MixSettings): master 70 % = s_volume; music 46 % x master = s_musicvolume;
// the weapon (85 %) and enemy (80 %) bus levels are baked into the sounds (tools/q3e/sound_bake.cpp)
seta s_volume "0.7"
seta s_musicvolume "0.322"
seta s_khz "44"
seta ca_music "1"
bind MOUSE1 "+attack"
bind r "+button6"
bind f "+button2"
bind TAB "+scores"
bind ESCAPE "togglemenu"
bind ` "toggleconsole"
bind F12 "screenshotJPEG"
