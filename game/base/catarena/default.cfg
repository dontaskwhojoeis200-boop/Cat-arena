// Cat Arena: Feral Claw — engine defaults (N10-Q3E stage B, generated by tools/q3e/make_base.py)
// Native game modules only (the Cat Arena modules are C++20; QVM cannot run them).
seta vm_game "0"
seta vm_cgame "0"
seta vm_ui "0"
seta cl_renderer "vulkan"
seta com_introPlayed "1"
seta sv_pure "0"
seta bot_enable "0"
seta name "Cat"
seta cl_run "1"
seta sensitivity "5"
seta r_mode "-1"
seta r_customwidth "1280"
seta r_customheight "720"
seta r_fullscreen "0"
seta r_vbo "1"
seta cg_drawFPS "1"
unbindall
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"
bind c "+movedown"
bind CTRL "+movedown"
bind SHIFT "+speed"
bind MOUSE1 "+attack"
bind TAB "+scores"
bind ESCAPE "togglemenu"
bind ` "toggleconsole"
bind F12 "screenshotJPEG"
